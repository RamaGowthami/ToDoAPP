<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ToDo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .login-container { max-width: 420px; margin: 5rem auto; }
        .navbar-brand { font-weight: bold; }
    </style>
    <script>
        function saveToken(token) {
            localStorage.setItem('jwtToken', token);
        }
        async function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok && data.status === 'success' && data.data && data.data.token) {
                saveToken(data.data.token);
                window.location.href = '/';
            } else {
                alert(data.message || 'Login failed');
            }
        }
    </script>
    <script>
        function logout() {
            localStorage.removeItem('jwtToken');
            window.location.href = '/login';
        }
    </script>
    <script>
        function authHeaders() {
            const t = localStorage.getItem('jwtToken');
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jwtToken');
            if (token) {
                // already logged in
            }
        });
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-tasks me-2"></i>ToDo App</a>
    </div>
    <div class="me-3">
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
    </nav>

<main class="container login-container">
    <div class="card">
        <div class="card-body">
            <h1 class="h4 mb-3"><i class="fas fa-sign-in-alt me-2"></i>Login</h1>
            <form onsubmit="doLogin(event)">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" class="form-control" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary">Back</a>
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
