# Database Configuration
# Use environment variables in production; fall back to local defaults for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todoapp?createDatabaseIfNotExist=true&serverTimezone=UTC&connectionTimeZone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON serialization timezone (affects any serialized dates)
spring.jackson.time-zone=UTC

# Security (JWT)
app.security.require-jwt=${APP_SECURITY_REQUIRE_JWT:false}
app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:admin123}
app.security.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me}
app.security.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}

# Server Configuration
server.port=${PORT:8080}

# Logging Configuration
logging.level.com.example.todoapp=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH
spring.web.cors.allowed-headers=*
